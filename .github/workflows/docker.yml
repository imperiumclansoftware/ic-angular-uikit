name: Docker (documentation)

# Publie l'image du site de documentation sur Docker Hub à chaque tag de version (v1.2.3), ou à la demande
# (onglet Actions → « Run workflow », version lue dans projects/ic-angular-uikit/package.json).
# Prérequis dans le dépôt GitHub : variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (jeton d'accès Docker Hub
# « Read, Write, Delete » : l'écriture de la description l'exige).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/ic-angular-uikit-docs

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Version de la librairie
        run: |
          version=$(node -p "require('./projects/ic-angular-uikit/package.json').version")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Contrôle avant publication : l'image démarre, répond et envoie la CSP.
      - name: Test de fumée (amd64)
        run: |
          docker buildx build --load --build-arg VERSION=${{ steps.version.outputs.value }} -t docs-smoke .
          docker run -d --name docs-smoke -p 8080:8080 --read-only --tmpfs /tmp docs-smoke
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8080/components/dashboard
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/inexistant.js)" = 404
          ! curl -fsS http://127.0.0.1:8080/ | grep -q '<script>'   # aucun script inline (CSP script-src 'self')
          docker rm -f docs-smoke

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Lancement manuel (pas de tag git) : mêmes étiquettes, tirées de package.json.
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=${{ steps.version.outputs.minor }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./DOCKERHUB.md
          # 100 octets maximum (un caractère accentué compte double).
          short-description: Documentation of IC Angular UiKit, accessible Angular components (nginx, strict CSP)
