# Site de documentation statique (dist/docs/browser), servi par nginx non root sur le port 8080.
# En-têtes de sécurité : security-headers.conf (inclus dans chaque location).
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Sonde de santé (HEALTHCHECK du conteneur, orchestrateurs).
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Fichiers générés avec une empreinte dans le nom (main-ABCD1234.js, chunk-…, styles-…, polices) : cache d'un an.
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2?|ttf|eot|svg)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Autres fichiers statiques : cache d'une heure, 404 s'ils n'existent pas (pas de repli sur index.html).
    location ~* \.(js|css|map|json|svg|png|jpe?g|webp|gif|ico|woff2?|ttf|txt|xml)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Routes de l'application (/components/dashboard…) : index.html, jamais mis en cache.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
